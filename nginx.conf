server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Enable CORS for federated module fetching
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Immutable cache for hashed assets
    location ~* \.(?:css|js|woff2?|ttf|png|jpg|jpeg|gif|ico|svg)$ {
        # Exception: do not cache remoteEntry.js long-term
        if ($request_uri ~* "remoteEntry\.js$") {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        if ($request_uri !~* "remoteEntry\.js$") {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        try_files $uri =404;
    }

    # SPA Fallback for client-side routing in Host & Remotes
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
